[project]
name = "wraven"
version = "0.1.0"
description = "Wraven: talk to the animatronic raven, powered by PolyAI's Dialog-RSN-1"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "livekit",
    "numpy",
    "piper-tts",
    "pyserial",
    "python-dotenv",
    "sounddevice",
    "soundfile",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false   # an app to run, not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
